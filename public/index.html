const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};

const fromMins=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};

const norm=s=>s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u0900-\u097f\s]/g,' ').replace(/\s+/g,' ').trim();

 for(const f of ALLFOODS()){if(!passF(f,fl))continue;let s=0;if(toks.length){const nw=norm(f.name).split(' '),aw=norm((f.alias||'').replace(/·/g,' ')).split(' ');let ok=true;
   for(const t of toks){const pl=t.length>3&&t.endsWith('s')?t.slice(0,-1):t;
    if(nw.includes(t)||nw.includes(pl))s+=6;else if(t.length>=3&&nw.some(w=>w.startsWith(t)))s+=4;else if(aw.includes(t)||aw.includes(pl))s+=4;else if(t.length>=3&&aw.some(w=>w.startsWith(t)))s+=2.5;

const UNITW={katori:'katori',katoris:'katori',bowl:'bowl',bowls:'bowl',glass:'glass',glasses:'glass',cup:'cup',cups:'cup',piece:'piece',pieces:'piece',slice:'slice',slices:'slice',plate:'plate',plates:'plate',tsp:'tsp',teaspoon:'tsp',tbsp:'tbsp',tablespoon:'tbsp',g:'g',gm:'g',gram:'g',grams:'g',ml:'ml',spoon:'tbsp',scoop:'scoop',handful:'handful'};

function matchOne(txt,loose){const t=norm(txt).replace(/^(of|the|some|my)\s+/,'');if(!t)return null;let r=searchFoods(t,[],3);

 parts.forEach(p=>{let q=1,rest=p;const m=p.match(/^(\d+(?:\.\d+)?|\d+\/\d+|[a-z]+)\s+(.*)$/);
  if(m){let n=/^\d+\/\d+$/.test(m[1])?m[1].split('/').reduce((a,b)=>a/b):/^\d/.test(m[1])?parseFloat(m[1]):NUMW[m[1]];if(n){q=n;rest=m[2]}}

function suggest(remK,remP){if(remK<60)return[];const snack=remK<420;const diet=S.me?.diet||'nv';const ok=c=>diet==='veg'?c[1]==='V':diet==='egg'?c[1]!=='N':true;

  const score=Math.abs(n.kcal-Math.min(remK,snack?250:600))/Math.max(remK,300)*.5+(1-Math.min(1,n.p/Math.max(10,Math.min(remP,snack?15:40))))*.8;res.push({name:c[0],n,items:c[3],score})});

function plateSVG(eaten,allow,animate){const cx=160,R=132,C=2*Math.PI*R,over=eaten>allow,pct=Math.min(1,allow>0?eaten/allow:0),left=allow-eaten;
 const extra=over?Math.min(1,(eaten-allow)/allow):0;
 return`<svg class="plate" viewBox="0 0 320 320" role="img" aria-label="${fmt(eaten)} of ${fmt(allow)} calories eaten">
 <defs><radialGradient id="stl" cx="38%" cy="32%" r="80%"><stop offset="0" stop-color="var(--steel1)"/><stop offset="1" stop-color="var(--steel2)"/></radialGradient></defs>
 <circle cx="${cx}" cy="${cx}" r="156" fill="url(#stl)"/><circle cx="${cx}" cy="${cx}" r="148" fill="none" stroke="var(--steel3)" stroke-width="1.5" opacity=".7"/>
 <circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="var(--track)" stroke-width="15"/>
 <circle class="${animate?'sweep':''}" cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${over?'var(--bad)':'var(--cal)'}" stroke-width="15" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="--full:${C};--to:${C*(1-pct)}" transform="rotate(-90 ${cx} ${cx})"/>
 ${over?`<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="var(--bad2)" stroke-width="15" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-extra)}" transform="rotate(-90 ${cx} ${cx})" opacity=".8"/>`:''}
 <circle cx="${cx}" cy="${cx}" r="112" fill="var(--surf)"/><circle cx="${cx}" cy="${cx}" r="112" fill="none" stroke="var(--steel2)" stroke-width="1.5"/>
 <text x="${cx}" y="${cx-30}" text-anchor="middle" class="pl-k">${over?'over by':'left'}</text>
 <text x="${cx}" y="${cx+22}" text-anchor="middle" class="pl-n" fill="${over?'var(--bad)':'var(--ink)'}">${fmt(Math.abs(left))}</text>
 <text x="${cx}" y="${cx+48}" text-anchor="middle" class="pl-k">kcal</text>
 <text x="${cx}" y="${cx+78}" text-anchor="middle" class="pl-s">${fmt(eaten)} eaten of ${fmt(allow)}</text></svg>`}
let kid=0;
function katori(pct,color,big){const id='k'+(kid++),y=70-Math.min(1,pct)*50;
 return`<svg class="kat${big?' big':''}" viewBox="0 0 100 78" aria-hidden="true"><defs><clipPath id="${id}"><path d="M6 20 Q7 68 50 71 Q93 68 94 20Z"/></clipPath></defs>
 <path d="M6 20 Q7 68 50 71 Q93 68 94 20Z" fill="var(--surf2)"/><g clip-path="url(#${id})"><rect x="0" y="${y}" width="100" height="80" fill="${color}"/><ellipse cx="50" cy="${y}" rx="46" ry="6" fill="#fff" opacity=".22"/></g>
 <path d="M6 20 Q7 68 50 71 Q93 68 94 20Z" fill="none" stroke="var(--steel3)" stroke-width="2.4"/><ellipse cx="50" cy="20" rx="44" ry="8" fill="none" stroke="var(--steel3)" stroke-width="2.4"/></svg>`}
const ringSm=(pct,col,txt)=>{const R=22,C=2*Math.PI*R;return`<svg viewBox="0 0 56 56" class="rsm"><circle cx="28" cy="28" r="${R}" fill="none" stroke="var(--track)" stroke-width="6"/><circle cx="28" cy="28" r="${R}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,pct))}" transform="rotate(-90 28 28)"/><text x="28" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${txt}</text></svg>`};

function barsSVG(vals,{labels=[],target=0,color='var(--cal)',keys=[],h=190}={}){const W=360,pl=8,pr=8,pt=14,pb=22,n=vals.length,bw=(W-pl-pr)/n,mx=Math.max(...vals,target||0,1)*1.1,ch=h-pt-pb;
 let s=`<svg class="bars" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" role="img">`;
 [.5,1].forEach(f=>s+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ch*(1-f/1.1)}" y2="${pt+ch*(1-f/1.1)}" stroke="var(--line)" stroke-width=".8"/>`);
 vals.forEach((v,i)=>{const bh=v/mx*ch,x=pl+i*bw;s+=`<g data-act="openDay" data-d="${keys[i]}" class="bar"><rect x="${x}" y="0" width="${bw}" height="${h-pb}" fill="transparent"/><rect x="${x+bw*.16}" y="${pt+ch-bh}" width="${bw*.68}" height="${Math.max(bh,v?1.5:0)}" rx="2" fill="${color}" opacity="${v?1:.15}"/></g>`;
  if(labels[i])s+=`<text x="${x+bw/2}" y="${h-7}" text-anchor="middle" font-size="9" fill="var(--mut)">${labels[i]}</text>`});
 if(target)s+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ch*(1-target/mx)}" y2="${pt+ch*(1-target/mx)}" stroke="var(--pro)" stroke-width="1.3" stroke-dasharray="4 3"/>`;return s+'</svg>'}
function lineSVG(pts,{h=150,unit=''}={}){if(pts.length<1)return'';const W=340,pl=34,pr=10,pt=12,pb=20,xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-1,y1=Math.max(...ys)+1;if(x1===x0)x1=x0+1;
 const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/(y1-y0))*(h-pt-pb);
 let s=`<svg class="line" viewBox="0 0 ${W} ${h}">`;[0,.5,1].forEach(f=>{const y=y0+(y1-y0)*f;s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)" stroke-width=".8"/><text x="${pl-4}" y="${Y(y)+3}" text-anchor="end" font-size="9" fill="var(--mut)">${r1(y)}</text>`});
 s+=`<polyline fill="none" stroke="var(--cal)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
 pts.forEach((p,i)=>{s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.4" fill="var(--surf)" stroke="var(--cal)" stroke-width="2"/>`;if(i===0||i===pts.length-1||pts.length<6)s+=`<text x="${X(p.x)}" y="${h-5}" text-anchor="middle" font-size="9" fill="var(--mut)">${p.l}</text>`});return s+'</svg>'}
function hoursSVG(hrs){const W=360,h=120,pl=6,bw=(W-pl*2)/24,mx=Math.max(...hrs,1);let s=`<svg class="bars" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none"><rect x="${pl+20*bw}" y="0" width="${4*bw}" height="${h-18}" fill="var(--bad)" opacity=".08"/>`;
 hrs.forEach((v,i)=>{const bh=v/mx*(h-34);s+=`<rect x="${pl+i*bw+bw*.15}" y="${h-18-bh}" width="${bw*.7}" height="${Math.max(bh,v?1.5:0)}" rx="2" fill="${i>=20?'var(--bad)':'var(--carb)'}" opacity="${v?1:.15}"/>`;if(i%3===0)s+=`<text x="${pl+i*bw+bw/2}" y="${h-5}" text-anchor="middle" font-size="9" fill="var(--mut)">${i%12||12}${i<12?'a':'p'}</text>`});return s+'</svg>'}

 <div class="sec"><h2>Weekly rhythm</h2><div class="card"><label class="row" style="cursor:pointer"><span class="grow"><b>Plan more for weekends</b><br><span class="sm mut">Same weekly average, shifted: extra on Sat &amp; Sun, a little less Mon–Fri.</span></span><input type="checkbox" ${S.sched.on?'checked':''} data-ch="sched" style="width:24px;height:24px"></label>${S.sched.on?`<label class="field"><span>Extra kcal on weekends</span><input class="inp" type="number" inputmode="numeric" value="${S.sched.extra}" data-ch="schedX"></label><p class="xs mut" style="margin:8px 0 0">Mon–Fri ${fmt(tg.kcal-Math.round(S.sched.extra*2/5))} · Sat–Sun ${fmt(tg.kcal+S.sched.extra)} kcal</p>`:''}</div></div>
 <div class="sec"><h2>About you</h2><div class="card"><div class="grid2">${num_('age','Age')}${num_('ht','Height (cm)')}${num_('wt','Weight (kg)')}${num_('tw','Target weight (kg)')}</div>
  <div class="field"><span>Sex (for the calorie formula)</span>${chipSet('sex',[['f','Female'],['m','Male'],['o','Other']],me.sex)}</div><div class="field"><span>Goal</span>${chipSet('goal',Object.entries(GOALS),me.goal)}</div>
  ${me.goal==='lose'||me.goal==='gain'?`<div class="field"><span>Pace (kg per week)</span>${chipSet('pace',[[.25,'0.25 easy'],[.5,'0.5 steady'],[.75,'0.75 fast']],me.pace)}</div>`:''}<div class="field"><span>Activity</span>${chipSet('act',Object.entries(ACTL).map(([k,v])=>[k,v[0]]),me.act)}</div>
  <div class="field"><span>Diet</span>${chipSet('diet',[['veg','Vegetarian'],['egg','Eggetarian'],['nv','Non-veg']],me.diet)}</div>
  <div class="field"><span>Avoid / allergies</span><div class="opts">${[['gluten','Gluten'],['lactose','Lactose'],['nuts','Nuts'],['jain','Onion-garlic free']].map(([v,l])=>`<button class="opt ${(me.allergy||[]).includes(v)?'on':''}" data-act="meTog" data-k="allergy" data-v="${v}">${l}</button>`).join('')}</div></div>
  <label class="field"><span>Name</span><input class="inp" value="${esc(me.name||'')}" data-ch="me" data-k="name"></label></div></div>
 ${S.ui.weight?weightCard(ws,cur):''}
 <div class="sec"><h2>Settings</h2><div class="card" style="padding:4px 12px">${tog('water','Water tracker','Glasses and ml on Home')}${tog('weight','Weight tracker','Weight, waist and body-fat log')}${tog('fast','Fasting timer','Simple intermittent-fasting clock on Home')}${tog('exAdd','Add exercise to my budget','Burned calories raise the day’s allowance')}
  <div class="li"><span class="grow b">Theme</span><div class="seg" style="width:200px">${['auto','light','dark'].map(t=>`<button class="${S.ui.theme===t?'on':''}" data-act="themeSet" data-t="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>${S.ui.fast?`<div class="li"><span class="grow b">Fasting plan</span>${chipSet('fastPlan',[['12:12','12:12'],['14:10','14:10'],['16:8','16:8'],['18:6','18:6']],S.fast.plan)}</div>`:''}</div></div>
 ${CFG?`<div class="sec"><h2>Permissions & app</h2><div class="card" style="padding:4px 12px">${permCard()}${isStandalone()?'':`<div class="li"><div class="grow"><b>Install app</b><br><span class="xs mut">${DEFERRED?'One-tap logging from your home screen.':isIOS()?'Tap Share, then “Add to Home Screen”.':'Use your browser menu → Install app.'}</span></div>${DEFERRED?'<button class="btn sm" data-act="install">Install</button>':''}</div>`}</div></div>`:''}
 <div class="sec"><h2>Data & connections</h2><div class="card sm"><p style="margin:0 0 8px">Your log is stored in this browser only (private to you; clearing site data erases it).</p>
  ${dataRows().map(([a,b,c])=>`<div class="li"><span class="badge ${c}">${c==='ok'?'ready':c==='ai'?'AI':'setup'}</span><div class="grow"><b>${a}</b><br><span class="xs mut">${b}</span></div></div>`).join('')}
  ${CFG?`<div class="row wrap" style="margin-top:10px"><button class="btn ghost sm" data-act="exportJson">Download backup</button><button class="btn ghost sm" data-act="exportCsv">Export CSV</button><button class="btn ghost sm" data-act="importPick">Restore backup</button><input id="impIn" type="file" accept=".json,application/json" hidden data-ch="importJson"></div>`:''}<a class="xs mut" href="/privacy.html" target="_blank" rel="noopener" style="display:block;margin-top:10px">Privacy notice</a><button class="btn bad full" style="margin-top:10px" data-act="resetAll">Erase all my data</button></div></div>`}
function weightCard(ws,cur){const pts=ws.map(w=>({x:pd(w.d).getTime()/864e5,y:w.kg,l:pd(w.d).getDate()+' '+MON[pd(w.d).getMonth()]}));
 return`<div class="sec"><h2>Weight <small>optional</small></h2><div class="card">${pts.length>1?lineSVG(pts):`<p class="sm mut" style="margin:0 0 8px">${pts.length?'Add another weigh-in to see your graph.':'Log your weight now and then to see a graph.'}</p>`}
 <div class="grid3" style="margin-top:10px"><label class="field" style="margin:0"><span>Weight (kg)</span><input class="inp" id="wkg" type="number" inputmode="decimal" step="0.1" placeholder="${cur||''}"></label><label class="field" style="margin:0"><span>Waist (cm)</span><input class="inp" id="wwa" type="number" inputmode="decimal" placeholder="—"></label><label class="field" style="margin:0"><span>Body fat %</span><input class="inp" id="wbf" type="number" inputmode="decimal" placeholder="—"></label></div>
 <button class="btn full" style="margin-top:10px" data-act="wAdd">Save today’s entry</button>${ws.length?`<div style="margin-top:8px">${[...ws].reverse().slice(0,5).map(w=>`<div class="li"><span class="grow sm">${dlabel(w.d)}</span><span class="b">${w.kg} kg</span>${w.waist?`<span class="sm mut">${w.waist} cm</span>`:''}${w.bf?`<span class="sm mut">${w.bf}%</span>`:''}<button class="iconbtn" style="width:32px;height:32px" data-act="wDel" data-d="${w.d}" aria-label="Delete">${ic('x',14)}</button></div>`).join('')}</div>`:''}</div></div>`}
ACT.wAdd=()=>{const kg=+$('#wkg').value;if(!(kg>20&&kg<300))return toast('Enter your weight in kg');const w={d:today(),kg:r1(kg)},wa=+$('#wwa').value,bf=+$('#wbf').value;if(wa)w.waist=wa;if(bf)w.bf=bf;S.weights=S.weights.filter(x=>x.d!==w.d).concat(w);S.me.wt=r1(kg);save();render();toast('Weight saved')};
ACT.wDel=t=>{S.weights=S.weights.filter(w=>w.d!==t.dataset.d);save();render()};
CHG.me=t=>{const k=t.dataset.k;S.me[k]=t.type==='number'?(t.value===''?'':+t.value):t.value;save();if(['wt','ht','age'].includes(k)&&k)toast('Saved — tap “Recalculate” to update targets')};
CHG.tg=t=>{S.tg[t.dataset.k]=+t.value||0;save()};
CHG.ui=t=>{S.ui[t.dataset.k]=t.checked;save();render()};CHG.sched=t=>{S.sched.on=t.checked;save();render()};CHG.schedX=t=>{S.sched.extra=Math.max(0,Math.min(1000,+t.value||0));save();render()};
ACT.meSet=t=>{const k=t.dataset.k,v=t.dataset.v;if(k==='fastPlan'){S.fast.plan=v}else S.me[k]=['pace'].includes(k)?+v:v;save();render()};
ACT.meTog=t=>{const k=t.dataset.k,a=S.me[k]||(S.me[k]=[]),i=a.indexOf(t.dataset.v);i>=0?a.splice(i,1):a.push(t.dataset.v);save();render()};
ACT.themeSet=t=>{const v=t.dataset.t;S.ui.theme=v;if(v==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;save();render()};
ACT.recalc=()=>{const me=S.me;if(!(me.age&&me.ht&&me.wt))return toast('Add age, height and weight first');const t=calcTargets(me);Object.assign(S.tg,{kcal:t.kcal,p:t.p,c:t.c,f:t.f,fib:t.fib,water:t.water});save();render();toast('Targets updated: '+fmt(t.kcal)+' kcal · '+t.p+' g protein')};
ACT.resetAll=()=>{if(confirm('Erase your whole log, foods, meals and settings from this browser? This can’t be undone.')){try{localStorage.removeItem(KEY)}catch(e){}S=Object.assign(defState());save();vd=today();render();startOnboarding()}};

/* ============ ONBOARDING ============ */
let OB=null;
const OBTIPS={out:'Eating out & street food: use the Look-alikes guide and log restaurant dishes before you eat.',night:'Late-night snacking: Insights → Timing shows how much lands after 8 PM.',sweet:'Mithai cravings: log by the piece — one gulab jamun is ~150 kcal.',skip:'Skipping meals: save your usual meals for one-tap logging.',portion:'Big portions: pick katori sizes when you log — your own katori beats guessing.',fest:'Festivals & weekends: turn on “Weekly rhythm” to plan extra for weekends.',chai:'Sugary chai: log tea with milk and sugar — a few cups add up.',protein:'Protein: watch the big pink number on Home — paneer, dal, eggs, soya and curd help.'};
function startOnboarding(){OB={i:0,d:{name:'',goal:null,sex:null,age:'',ht:'',wt:'',tw:'',pace:.5,act:null,diet:null,allergy:[],obst:[]}};renderOB()}
const obSteps=()=>['welcome','goal','body',...(['lose','gain'].includes(OB.d.goal)&&OB.d.age>=18?['pace']:[]),'act','diet','obst',...(CFG?['perm']:[]),'plan'];
function renderOB(){const d=OB.d,st=obSteps(),cur=st[OB.i],w=$('#obw');let body='',btn='Continue';
 const opt=(k,v,l,s)=>`<button class="big-opt ${(Array.isArray(d[k])?d[k].includes(v):d[k]===v)?'on':''}" data-act="${Array.isArray(d[k])?'obTog':'obSet'}" data-k="${k}" data-v="${v}"><span class="grow">${l}${s?`<small>${s}</small>`:''}</span></button>`;
 if(cur==='welcome'){body=`<div class="c" style="margin:28px 0 20px">${art(F('nthali'),110)}<h1 style="margin-top:12px">Welcome to Bitewise</h1><p class="mut">The calorie & protein tracker built around Indian food — katoris, rotis and chai included. A few quick questions to set your daily targets.</p></div><label class="field"><span>What should we call you?</span><input class="inp" id="obn" value="${esc(d.name)}" placeholder="Your name" data-in="obName"></label>`;btn='Let’s begin'}
 if(cur==='goal'){body=`<h1>What’s your goal?</h1><p class="mut">This sets your calorie target.</p>${opt('goal','lose','Lose weight','Gentle calorie deficit')}${opt('goal','maintain','Maintain my weight','Eat at your daily need')}${opt('goal','gain','Gain weight','Small calorie surplus')}${opt('goal','muscle','Build muscle','Surplus + higher protein')}`}
 if(cur==='body'){const g=d.goal;body=`<h1>About you</h1><p class="mut">Used only for the calorie formula. Stays in this browser.</p><div class="field"><span>Sex</span><div class="opts">${[['f','Female'],['m','Male'],['o','Other']].map(([v,l])=>`<button class="opt ${d.sex===v?'on':''}" data-act="obSet" data-k="sex" data-v="${v}">${l}</button>`).join('')}</div></div><div class="grid2"><label class="field"><span>Age</span><input class="inp" type="number" inputmode="numeric" value="${d.age}" data-in="obf" data-k="age"></label><label class="field"><span>Height (cm)</span><input class="inp" type="number" inputmode="numeric" value="${d.ht}" data-in="obf" data-k="ht"></label><label class="field"><span>Weight (kg)</span><input class="inp" type="number" inputmode="decimal" value="${d.wt}" data-in="obf" data-k="wt"></label>${g==='lose'||g==='gain'?`<label class="field"><span>Target weight (kg)</span><input class="inp" type="number" inputmode="decimal" value="${d.tw}" data-in="obf" data-k="tw"></label>`:''}</div>${d.age&&d.age<18?'<div class="note sm" style="margin-top:12px">These estimates are meant for adults. Under 18, please talk to a parent and doctor about food and weight — we’ll set a maintenance target.</div>':''}`}
 if(cur==='pace'){body=`<h1>How fast?</h1><p class="mut">A slower pace is easier to keep up.</p>${opt('pace',.25,'Easy · 0.25 kg / week','Most flexible')}${opt('pace',.5,'Steady · 0.5 kg / week','Recommended for most people')}${opt('pace',.75,'Faster · 0.75 kg / week','Needs consistency — go slower if you feel tired')}`}
 if(cur==='act'){body=`<h1>How active are you?</h1><p class="mut">Think of a typical day, not workouts alone.</p>${Object.entries(ACTL).map(([k,v])=>opt('act',k,v[0],v[1])).join('')}`}
 if(cur==='diet'){body=`<h1>What do you eat?</h1><p class="mut">We’ll tailor food ideas.</p>${opt('diet','veg','Vegetarian','No egg, fish or meat')}${opt('diet','egg','Eggetarian','Vegetarian plus eggs')}${opt('diet','nv','Non-vegetarian','Everything')}<div class="field"><span>Anything to avoid? (optional)</span><div class="opts">${[['gluten','Gluten'],['lactose','Lactose'],['nuts','Nuts'],['jain','Onion-garlic free']].map(([v,l])=>`<button class="opt ${d.allergy.includes(v)?'on':''}" data-act="obTog" data-k="allergy" data-v="${v}">${l}</button>`).join('')}</div></div>`}
 if(cur==='obst'){body=`<h1>What gets in the way?</h1><p class="mut">Pick any — we’ll give you a tip for each.</p>${[['out','Eating out & street food'],['night','Late-night snacking'],['sweet','Mithai / sweet cravings'],['skip','Skipping meals'],['portion','Big portions'],['fest','Festivals & weekend meals'],['chai','Sugary chai & coffee'],['protein','Not enough protein']].map(([v,l])=>opt('obst',v,l)).join('')}`;btn='See my plan'}
 if(cur==='perm'){body=`<h1>Log faster</h1><p class="mut">Turn on what you’d like — change it anytime in Profile. Photo upload and search always work without any permission.</p><div class="card" style="padding:4px 12px">${permCard()}</div><p class="xs mut" style="margin-top:12px">Photos and voice text you choose to analyze are sent to our AI service to identify the food. They aren’t stored on our server.</p>`}
 if(cur==='plan'){const me=obMe(),t=calcTargets(me),wk=planWeeks(me),under=me.tw&&me.ht&&me.tw/((me.ht/100)**2)<18.5;body=`<h1>${d.name?esc(d.name)+', your':'Your'} plan</h1><p class="mut">Estimates to start with — adjust anytime.</p>
  <div class="card c"><div class="mut sm b" style="letter-spacing:.06em;text-transform:uppercase">Daily calorie budget</div><div class="num" style="font-size:60px;line-height:1">${fmt(t.kcal)}</div><div class="sm mut">kcal · your body burns about ${fmt(t.tdee)} a day</div></div>
  <div class="grid3" style="margin-top:10px"><div class="stat c"><b class="num" style="color:var(--pro)">${t.p} g</b><span>Protein</span></div><div class="stat c"><b class="num">${t.c} g</b><span>Carbs</span></div><div class="stat c"><b class="num">${t.f} g</b><span>Fat</span></div></div>
  ${wk?`<div class="card" style="margin-top:10px"><b>About ${wk} weeks</b> to go from ${me.wt} kg to ${me.tw} kg at ${me.pace} kg a week — around ${dlabel(addDays(today(),wk*7))}.</div>`:''}${under?'<div class="note sm" style="margin-top:10px">Your target weight is in the underweight range. Consider a higher target or check with a doctor.</div>':''}${me.goal==='lose'&&t.kcal<=(me.sex==='m'?1500:1200)?'<div class="note sm" style="margin-top:10px">This is the minimum we suggest — for a bigger deficit, please involve a doctor or dietitian.</div>':''}
  ${d.obst.length?`<div class="card" style="margin-top:10px"><b>Your focus</b>${d.obst.map(o=>`<p class="sm" style="margin:6px 0 0">• ${OBTIPS[o]}</p>`).join('')}</div>`:''}
  <div class="field"><span>Also track (optional)</span><div class="opts">${[['water','Water'],['weight','Weight'],['fast','Fasting timer']].map(([k,l])=>`<button class="opt ${S.ui[k]?'on':''}" data-act="obUi" data-k="${k}">${l}</button>`).join('')}</div></div>
  <p class="xs mut" style="margin-top:12px">Targets are general estimates (Mifflin-St Jeor + activity), not medical advice.</p>`;btn='Start tracking'}
 w.innerHTML=`<div class="ob"><div class="in"><div class="row sp"><div class="dots grow">${st.map((_,i)=>`<i class="${i<=OB.i?'on':''}"></i>`).join('')}</div>${cur!=='welcome'?'':`<button class="sm mut" style="margin:0 0 14px 12px" data-act="obSkip">Skip</button>`}</div><div class="grow">${body}</div><div class="row" style="margin-top:18px">${OB.i>0?`<button class="btn ghost" data-act="obBack">Back</button>`:''}<button class="btn grow" data-act="obNext">${btn}</button></div></div></div>`}
function obMe(){const d=OB.d,age=+d.age||30;return{name:d.name,goal:age<18?'maintain':d.goal||'maintain',sex:d.sex||'o',age,ht:+d.ht||165,wt:+d.wt||65,tw:+d.tw||0,pace:+d.pace||.5,act:d.act||'l',diet:d.diet||'nv',allergy:d.allergy,obst:d.obst}}
INP.obName=t=>{OB.d.name=t.value};INP.obf=t=>{OB.d[t.dataset.k]=t.value;if(t.dataset.k==='age'&&(+t.value>0&&+t.value<18)!==OB.minor){OB.minor=+t.value>0&&+t.value<18;renderOB();const i=$('input[data-k=age]');i.focus()}};
ACT.obSet=t=>{const k=t.dataset.k;OB.d[k]=k==='pace'?+t.dataset.v:t.dataset.v;renderOB()};ACT.obTog=t=>{const a=OB.d[t.dataset.k],i=a.indexOf(t.dataset.v);i>=0?a.splice(i,1):a.push(t.dataset.v);renderOB()};
ACT.obUi=t=>{S.ui[t.dataset.k]=!S.ui[t.dataset.k];renderOB()};ACT.obBack=()=>{OB.i=Math.max(0,OB.i-1);renderOB()};
ACT.obSkip=()=>{S.me={name:OB.d.name,goal:'maintain',sex:'o',age:30,ht:165,wt:65,tw:0,pace:.5,act:'l',diet:'nv',allergy:[],obst:[],sw:65};S.weights=[];save();OB=null;$('#obw').innerHTML='';render()};
ACT.obNext=()=>{const d=OB.d,st=obSteps(),cur=st[OB.i];
 if(cur==='goal'&&!d.goal)return toast('Pick a goal to continue');
 if(cur==='body'){if(!d.sex)return toast('Choose an option for sex');if(!(+d.age>=10&&+d.age<=100))return toast('Enter your age');if(!(+d.ht>=100&&+d.ht<=230))return toast('Enter your height in cm');if(!(+d.wt>=25&&+d.wt<=300))return toast('Enter your weight in kg');
  if((d.goal==='lose'||d.goal==='gain')&&+d.age>=18){if(!(+d.tw>=25))return toast('Enter your target weight');if(d.goal==='lose'&&+d.tw>=+d.wt)return toast('Target should be below your current weight');if(d.goal==='gain'&&+d.tw<=+d.wt)return toast('Target should be above your current weight')}}
 if(cur==='act'&&!d.act)return toast('Choose your activity level');if(cur==='diet'&&!d.diet)return toast('Choose what you eat');
 if(cur==='plan'){const me=obMe(),t=calcTargets(me);me.sw=me.wt;S.me=me;S.tg={kcal:t.kcal,p:t.p,c:t.c,f:t.f,fib:t.fib,water:t.water};S.weights=[{d:today(),kg:me.wt}];save();OB=null;$('#obw').innerHTML='';render();return}
 OB.i++;renderOB();$('.ob')?.scrollTo(0,0);if(obSteps()[OB.i]==='perm')refreshPerm().then(()=>OB&&renderOB())};


/* ============ PERMISSIONS, INSTALL, BACKUP (hosted app) ============ */
const PERM={cam:'unknown',mic:'unknown'};
async function refreshPerm(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){PERM.cam=PERM.mic='unavailable';return}
 for(const[k,n]of[['cam','camera'],['mic','microphone']]){try{const s=await navigator.permissions.query({name:n});PERM[k]=s.state;s.onchange=()=>{PERM[k]=s.state;if(OB)renderOB();else if(route==='profile')render()}}catch(e){}}}
ACT.askPerm=async t=>{const k=t.dataset.k;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)PERM[k]='unavailable';else{try{const s=await navigator.mediaDevices.getUserMedia(k==='cam'?{video:{facingMode:'environment'}}:{audio:true});s.getTracks().forEach(x=>x.stop());PERM[k]='granted'}catch(e){PERM[k]=(e.name==='NotAllowedError'||e.name==='SecurityError')?'denied':'unavailable'}}OB?renderOB():render()};
function permCard(){const row=(k,ttl,why)=>{const s=PERM[k];return`<div class="li"><div class="grow"><b>${ttl}</b><br><span class="xs mut">${why}</span></div>${s==='granted'?'<span class="badge ok">On</span>':s==='denied'?'<span class="badge warn">Blocked</span>':s==='unavailable'?'<span class="badge">Not available</span>':`<button class="btn sm" data-act="askPerm" data-k="${k}">Allow</button>`}</div>${s==='denied'?`<p class="xs mut" style="margin:0 0 8px">Blocked in your browser or phone settings. Open the site/app settings (lock icon by the address bar, or Settings → Bitewise) and switch ${k==='cam'?'Camera':'Microphone'} on.</p>`:''}`};
 return row('cam','Camera','Scan barcodes live. (Photo upload works without this.)')+row('mic','Microphone','Log meals by voice. Your browser’s speech service turns speech into text (Google in Chrome, Apple on iPhone).')}
let DEFERRED=null;const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone||!!window.Capacitor;const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installBanner(){if(!CFG||isStandalone()||S.ui.installHide||!(DEFERRED||isIOS()))return'';return`<div class="card note" style="margin:8px 0"><div class="row"><div class="grow sm"><b>Install Bitewise</b><br>Add it to your home screen for one-tap logging${isIOS()&&!DEFERRED?' — tap Share, then “Add to Home Screen”':''}.</div>${DEFERRED?'<button class="btn hal sm" data-act="install">Install</button>':''}<button class="iconbtn" style="width:34px;height:34px" data-act="installHide" aria-label="Dismiss">${ic('x',16)}</button></div></div>`}
ACT.install=async()=>{if(!DEFERRED)return;DEFERRED.prompt();try{await DEFERRED.userChoice}catch(e){}DEFERRED=null;render()};ACT.installHide=()=>{S.ui.installHide=true;save();render()};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(route==='home'||route==='profile')render()});window.addEventListener('appinstalled',()=>{DEFERRED=null;render()});
function dataRows(){const base=[['Food database',`${FOODS.length} Indian foods, typical values`,'ok']];
 if(CFG){const h=HEALTH;if(!h)base.push(['Server','Checking…','warn']);else if(h.error)base.push(['Server','Not reachable — check your connection','warn']);else base.push(['Photo, voice, label & custom-food AI',h.ai?'Connected':'Server has no GEMINI_API_KEY yet',h.ai?'ai':'warn'],['Barcode → product database','Open Food Facts (via server)','ok'],['Custom-food web search','Open Food Facts + Google Search grounding','ok'])}
 else base.push(['Photo, voice, label & custom-food AI','Uses Gemini when the published app is connected','ai'],['Barcode → product database','Open Food Facts adapter · '+({untested:'tries when you scan',connected:'connected',unreachable:'not reachable from this page'})[PROVIDERS.off.status],'warn'],['Live web nutrition search','Uses Google Search during custom-food estimates','warn']);return base}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
ACT.exportJson=()=>dl('bitewise-backup-'+today()+'.json',JSON.stringify(S),'application/json');
ACT.exportCsv=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['date','time','meal','food','quantity','unit','grams','kcal','protein_g','carbs_g','fat_g','fibre_g','sugar_g','sodium_mg','source']];
 [...S.entries].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(e=>rows.push([e.date,e.time,e.meal==='custom'?e.cust:MEALNAME[e.meal],e.name,e.qty,e.unit,r0(e.g),r1(e.n.kcal),r1(e.n.p),r1(e.n.c),r1(e.n.f),r1(e.n.fib),r1(e.n.sug),r0(e.n.na),e.src]));dl('bitewise-food-log-'+today()+'.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')};
ACT.importPick=()=>$('#impIn').click();
CHG.importJson=async t=>{const f=t.files[0];t.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.entries)||!j.tg)throw 0;if(!confirm('Replace everything in this app with the backup from '+f.name+'?'))return;S=Object.assign(defState(),j);S.ui=Object.assign(defState().ui,S.ui||{});save();vd=today();render();toast('Backup restored')}catch(e){toast('That file isn’t a Bitewise backup')}};

/* ============ BOOT ============ */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]){if(t.tagName!=='INPUT')e.preventDefault();ACT[t.dataset.act](t,e)}else if(e.target.id==='ov'){ACT.closeSheet()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on'))ACT.closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-in]');if(t&&INP[t.dataset.in])INP[t.dataset.in](t,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-ch]');if(t&&CHG[t.dataset.ch])CHG[t.dataset.ch](t,e)});
window.addEventListener('pagehide',()=>{scanStop();stopVoice()});
(function boot(){if(S.ui.theme&&S.ui.theme!=='auto')document.documentElement.dataset.theme=S.ui.theme;
 const used=new Set();S.entries.forEach(e=>used.add(e.fid));S.meals.forEach(m=>m.items.forEach(i=>used.add(i.fid)));S.learn.hashes.forEach(h=>h.items.forEach(i=>used.add(i.fid)));Object.keys(S.tfoods).forEach(k=>{if(!used.has(k))delete S.tfoods[k]});
 render();if(!S.me)startOnboarding();
 if(CFG){fetch(API+'/api/health').then(r=>r.json()).then(h=>{HEALTH=h;if(route==='profile')render()}).catch(()=>{HEALTH={error:true};if(route==='profile')render()});refreshPerm().then(()=>{if(route==='profile')render()});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
  const h=location.hash.slice(1);if(S.me){if(['add','photo','scan','history','insights','profile'].includes(h))go(h);else if(h==='voice')setTimeout(()=>ACT.voice(),400)}}})();
</script>
