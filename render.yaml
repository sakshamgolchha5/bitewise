services:
  - type: web
    name: bitewise
    runtime: node
    plan: free
    buildCommand: echo "prebuilt Bitewise web app"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: AI_LIMIT_PER_IP_PER_DAY
        value: "15"
      - key: AI_LIMIT_PER_IP_PER_MIN
        value: "3"
      - key: MODEL_VISION
        value: gemini-2.5-flash-lite
      - key: MODEL_FAST
        value: gemini-2.5-flash-lite
